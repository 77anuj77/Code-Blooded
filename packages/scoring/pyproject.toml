[project]
name = "scoring"
version = "0.1.2"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "sqlmodel>=0.0.38",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scoring"]

[tool.setuptools.package-dir]
scoring = "."

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
